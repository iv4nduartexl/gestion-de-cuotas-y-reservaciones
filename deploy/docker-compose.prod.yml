# Production stack for one VPS. Run from this folder:
#   cp .env.production.example .env.production   # fill it in
#   ./deploy.sh
# See docs/deploy.md.

name: agenda

x-app-image: &app-image ${APP_IMAGE:-ghcr.io/iv4nduartexl/gestion-de-cuotas-y-reservaciones}:${TAG:-latest}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only reachable from the other containers.

  # Applies pending migrations, then exits. The app starts only if it succeeds.
  migrate:
    image: *app-image
    command: ["node", "scripts/migrate.mjs"]
    env_file: .env.production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: *app-image
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Scheduled jobs (cuotas + reminders) every 15 minutes, over the internal network.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env.production}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 900
          curl -fsS -m 120 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/run || echo "cron run failed"
          echo
        done
    depends_on:
      app:
        condition: service_healthy

  # Nightly pg_dump into the backups volume (kept BACKUP_KEEP_DAYS days).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-agenda}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-agenda}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-6}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # Seconds until the next BACKUP_HOUR_UTC:00 (plain arithmetic, busybox-safe).
          delay=$$(( (BACKUP_HOUR_UTC * 3600 - $$(date -u +%s) % 86400 + 86400) % 86400 ))
          sleep $$(( delay == 0 ? 86400 : delay ))
          file=/backups/agenda-$$(date -u +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$file.tmp"; then mv "$$file.tmp" "$$file"; echo "backup ok: $$file"; else rm -f "$$file.tmp"; echo "backup FAILED"; fi
          find /backups -name 'agenda-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backups:
